- year: "2017"
  category: "Education"
  header: "Entered Zewail City of Science and Technology"
  location: "Giza, Egypt"
  body: "Began undergraduate studies in Biomedical Sciences on a four-year merit scholarship, drawn to the overlap of biology and computation."

- year: "Spring 2018"
  category: "Transition"
  header: "Declared Computational Biology & Genomics"
  location: "Giza, Egypt"
  body: "Committed to computational approaches over traditional wet-lab work."

- year: "2019 – 2021"
  category: "Research"
  header: "Undergraduate genomics projects"
  location: "Giza, Egypt"
  body: "Built genomics tools from scratch in R, Python, and C++ — [SNP calling](https://github.com/MayarMAhmed/SNP-Calling-R-workflow), a [diabetes SNP detector](https://github.com/MayarMAhmed/Diabetes-Mellitus-associated-SNP-Detection-Algorithm), a [UPGMA tree builder](https://github.com/MayarMAhmed/Phylogenetic-Tree-Construction-using-UPGMA), and a [genomic-mismatch pipeline](https://github.com/MayarMAhmed/Detection-and-Visualization-of-Genomic-Mismatches)."

- year: "2019 – 2020"
  category: "Research"
  header: "Research internships"
  location: "Giza, Egypt"
  body: "Collected and analyzed EEG and facial-expression data for the Lumiere concentration-detection project, then interpreted variants and ran enrichment analysis (g:Profiler, KEGG) for an Alzheimer's GWAS study."

- year: "2020 – 2021"
  category: "Research"
  header: "Undergraduate Thesis — AML drug sensitivity"
  location: "Giza, Egypt"
  body: "Trained Random Forest models on patient RNA-seq profiles to predict AML sensitivity to five ERBB inhibitors, identifying markers linked to differential drug response. Advised by Dr. Eman Badr; graduated *Cum Laude* and on the Provost's Honors Roll."

- year: "Aug 2021"
  category: "Transition"
  header: "Moved to the U.S. to pursue drug discovery"
  location: "Pittsburgh, PA"
  body: "My thesis clarified the gap between finding genomic markers and knowing how a patient actually responds to a drug. To work on that gap, I moved to Pittsburgh for a PhD in Molecular, Cellular & Developmental Biology, focused on computational structural biology and drug design."

- year: "2021 – 2022"
  category: "Research"
  header: "First-year rotations"
  location: "Pittsburgh, PA"
  body: "Completed three ten-week rotations spanning the structural-biology spectrum: the [VanDemark Lab](https://www.biology.pitt.edu/people/andrew-vandemark) (wet-lab structural biology — testing small-molecule inhibitors of the profilin–actin interaction by fluorescence anisotropy), the [Durrant Lab](https://durrantlab.pitt.edu/) (computational structural biology and drug design), and the [Levin Lab](https://www.teralevinlab.com) (comparative genomics)."

- year: "Summer 2022"
  category: "Transition"
  header: "Joined the Durrant Lab"
  location: "Pittsburgh, PA"
  body: "Chose the Durrant Lab for my dissertation, focusing on structure-based drug design and open-source scientific software. Began developing **[LIGNOVA](/research/#lignova)**, an automated pipeline that docks bioactive PubChem compounds against experimental protein structures to build large-scale, quality-graded datasets for machine learning — now over 258 million docked poses across 5.86 million protein–ligand pairs (243,805 ligands, 11,268 structures)."

- year: "Apr 2023"
  category: "Research"
  header: "Passed the comprehensive examination"
  location: "Pittsburgh, PA"
  body: "Defended an independent research proposal in an NIH F31 format to my committee, clearing the PhD comprehensive exam."

- year: "2023 – 2024"
  category: "Research"
  header: "Presenting LIGNOVA at Gordon Research Conferences"
  location: "West Dover, VT & Portland, ME"
  body: "Presented early versions of LIGNOVA as posters at the Computer-Aided Drug Design GRC (2023) and the Computational Chemistry GRC (2024). See [publications](/publications/)."

- year: "2022 – 2025"
  category: "Research"
  header: "Genomics collaboration — PNAS 2025"
  location: "Pittsburgh, PA"
  body: "Extended my Levin Lab rotation into a co-first-author study of how a hypermutable hotspot drives rapid recognition-gene evolution in *Dictyostelium*. Led the computational genomics, genome assembly, QC, and targeted annotation across ten chromosome-length genomes. Published in *PNAS* (2025)."

- year: "Spring 2024 & Fall 2025"
  category: "Teaching"
  header: "Graduate Teaching Assistant & Fellow — Biochemistry"
  location: "Pittsburgh, PA"
  body: "Led recitations and weekly office hours for ~200 students and mentored 15 undergraduate TAs. Nominated by students for the Elizabeth Baranger Excellence in Teaching Award in 2024 and 2026."

- year: "Summer 2024"
  category: "Teaching"
  header: "Undergraduate Research Mentor — TECBio REU"
  location: "Pittsburgh, PA"
  body: "Co-mentored an undergraduate on a ten-week project applying AlphaFold2 to explore HIV protease conformations for drug design, culminating in a research poster."

- year: "2026"
  category: "Research"
  header: "Scaling LIGNOVA and stress-testing ML scoring"
  location: "Pittsburgh, PA & Cambridge, MA"
  body: "Earned a competitive NSF ACCESS allocation (Purdue Anvil + TAMU ACES) to scale LIGNOVA, and used the dataset to [stress-test a deep-learning affinity model](/research/#ml-evaluation), exposing a molecular-size shortcut and blindness to activity cliffs. Presented the full pipeline at the Computational Medicinal Chemistry School in October, supported by a GPSG travel grant."

- year: "Feb 2026"
  category: "Present"
  header: "Advanced to PhD Candidacy"
  location: "Pittsburgh, PA"
  body: "Proposed my dissertation work to my committee and was admitted to candidacy. Now wrapping up my PhD (expected April 2027) and seeking industry roles in computational drug discovery, ML for chemistry, and cheminformatics / scientific software."
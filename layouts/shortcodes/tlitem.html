<div class="tl-item">
  <span class="tl-dot"></span>
  <div class="tl-card">
    {{ with .Get "badge" }}<span class="tl-badge">{{ . }}</span>{{ end }}
    {{ with .Get "header" }}<div class="tl-header">{{ . | markdownify }}</div>{{ end }}
    {{ with .Get "subheader" }}<div class="tl-subheader">{{ . | markdownify }}</div>{{ end }}
    <div class="tl-body">{{ .Inner | markdownify }}</div>
  </div>
</div>

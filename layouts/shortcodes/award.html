{{ $url := .Get "url" }}
<div class="award{{ if $url }} pub-link{{ end }}"{{ with $url }} onclick="window.open('{{ . }}','_blank')"{{ end }}>
  <div class="award-top">
    <span class="award-title">{{ .Get "title" | markdownify }}</span>
    {{ with .Get "year" }}<span class="award-year">{{ . }}</span>{{ end }}
  </div>
  {{ with .Get "org" }}<div class="award-org">{{ . | markdownify }}</div>{{ end }}
</div>

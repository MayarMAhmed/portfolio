<style>
/* --- Alternating timeline --- */
.tl { position: relative; margin: 2.5rem 0; }
.tl::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%;
  width: 2px; transform: translateX(-50%); background: rgba(120,120,130,.35);
}
.tl-item {
  position: relative; width: 50%; box-sizing: border-box;
  padding: .75rem 2.25rem .75rem 0; margin-bottom: 1.5rem; text-align: right;
}
.tl-item:nth-child(even) {
  margin-left: 50%; padding: .75rem 0 .75rem 2.25rem; text-align: left;
}
.tl-dot {
  position: absolute; top: 1.5rem; width: 15px; height: 15px; border-radius: 9999px;
  background: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.25);
}
.tl-item:nth-child(odd) .tl-dot { right: -8px; }
.tl-item:nth-child(even) .tl-dot { left: -8px; }
.tl-card {
  display: inline-block; text-align: left; padding: 1rem 1.25rem; border-radius: .75rem;
  background: rgba(125,125,135,.08); border: 1px solid rgba(125,125,135,.2);
}
.tl-badge {
  display: inline-block; font-size: .75rem; font-weight: 600; padding: .15rem .6rem;
  border-radius: 9999px; background: rgba(59,130,246,.15); color: #3b82f6; margin-bottom: .4rem;
}
.tl-header { margin: .1rem 0; font-size: 1.15rem; font-weight: 700; }
.tl-subheader { font-size: .95rem; opacity: .85; margin-bottom: .4rem; }
.tl-body { font-size: .95rem; opacity: .9; }
.tl-body p { margin: .3rem 0 0; }

@media (max-width: 768px) {
  .tl::before { left: 7px; transform: none; }
  .tl-item, .tl-item:nth-child(odd), .tl-item:nth-child(even) {
    width: 100%; margin-left: 0; padding: .5rem 0 .5rem 2.25rem; text-align: left;
  }
  .tl-item:nth-child(odd) .tl-dot, .tl-item:nth-child(even) .tl-dot { left: 0; right: auto; }
}
